
<div class="profile-card">
  <div class="title">
    <h3>{{dto().name}}</h3>
  </div>
  @for(item of (dto() | keyvalue); track item.key)
  {
  @if(item.key !== "name" && item.key !== "id"){
  <p>{{item.key}}: {{item.value}}</p>

  <button (click)="valueToEdit.set(item.value)">Edit</button>

    @if(valueToEdit() === item.value)
    {
      <app-edit-profile [valueToChange]="item.value" (sendNewValue)="updateProfile(item.key, $event)" />
    }
  }
  }

<button (click)="wantsToDelete.set(!wantsToDelete())">Delete user</button>
@if(wantsToDelete())
{
  <app-delete-user (deleteStatus)="$event ? deleteUser() : null"/>
}
</div>
