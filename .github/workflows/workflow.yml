name: build and test

on:
  push:
    paths-ignore: 
      - "PetAndOwner.Presentation/**"
  pull_request:
    branches:
      - main
    paths-ignore: 
      - "PetAndOwner.Presentation/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - name: Setup dotnet 
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: |
              9.0.x
              10.0.x
        - name: build project
          run: dotnet build --no-restore
  format_and_test:
    
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
              9.0.x
              10.0.x
      - name: format code
        run: dotnet format --verify-no-changes --no-restore
      - name: test
        run: dotnet test --no-build
        
  
    
