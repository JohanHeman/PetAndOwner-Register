name: build and test

on:
  push:

  pull_request:
    branches:
      - main
    paths-ignore: 
      - "PetAndOwner.Presentation/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: checkout
          uses: actions/checkout@v6

        - name: Setup dotnet 
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: |
              8.0.x
              9.0.x
              10.0.x
        - name: build project
          run: dotnet build
  format_and_test:
    
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
              8.0.x
              9.0.x
              10.0.x
      - name: format code
        run: dotnet format
      - name: test
        run: dotnet test
        
  
    
