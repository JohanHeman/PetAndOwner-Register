name: build and test

on:
  push:
    paths-ignore: 
      - "PetAndOwner.Presentation/**"
  pull_request:
    branches:
      - main
    paths-ignore: 
      - "PetAndOwner.Presentation/**"

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: restore
        run: dotnet restore

      - name: check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: build
        run: dotnet build --no-restore

      - name: test
        run: dotnet test --no-build
        
  
    
