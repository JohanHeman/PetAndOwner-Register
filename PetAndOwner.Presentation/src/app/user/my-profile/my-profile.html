<div class="profile-card">
  <div class="title">
    <h3>{{dto().name}}</h3>
  </div>
  @for(item of (dto() | keyvalue); track item.key){
    @if(item.key !== "name" && item.key !== "id")
    {
      <p>{{item.key}}: {{item.value}}</p>
      @if(item.key !== "age" )
      {
        <button (click)="valueToEdit.set(item.key)">Edit</button>

        @if(valueToEdit() === item.key)
        {
        <app-edit-profile [valueToChange]="item.key" [currentValue]="item.value" [isDate]="item.key === 'birthDate' " (sendNewValue)="updateProfile(item.key, $event)"
        (canceld)="valueToEdit.set($event)"/>
        }
      }
    }
  }

  <button class="pad" (click)="wantsToDelete.set(!wantsToDelete())">Delete user</button>
  @if(wantsToDelete())
  {
    <app-delete-user (deleteStatus)="$event ? deleteUser() : null" />
  }
</div>
