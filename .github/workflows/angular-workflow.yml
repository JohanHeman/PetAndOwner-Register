name: frontend build and test

on:
  push:
    branches: [main]
    paths:
      # only run when files in the presentation layer change
      # [**] = any file at any depth below this folder
      - 'PetAndOwner.Presentation/**'
  pull_request:
    paths:
      - 'PetAndOwner.Presentation/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # every step executes inside the Angular project folder
        working-directory: PetAndOwner.Presentation
    steps:
      # download the repository code onto the runner
      - name: download
        uses: actions/checkout@v4

      # install Node and cache npm packages between runs
      - name: fix node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # the cache is not strictly necessary but makes the process faster
          cache: npm
          # package-lock.json pins exact package versions; its hash decides if the npm cache is reused.
          # It is not in the repo root, so we point to it.
          cache-dependency-path: PetAndOwner.Presentation/package-lock.json

      # install dependencies as recorded in package-lock.json
      - name: install dependencies
        run: npm ci

      # compile the Angular app
      - name: build
        run: npm run build

      # run the tests in a few different browsers
      # [--watch=false] so it won't hang, headless because the runner has no display
      - name: run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless,FirefoxHeadless
