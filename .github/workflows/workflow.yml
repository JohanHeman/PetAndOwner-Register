name: build and test

on:
  workflow_dispatch: 
  push:

  pull_request:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x']
    steps:
        - name: checkout
          uses: actions/checkout@v6
        - name: Setup dotnet ${{ matrix.dotnet-version }}
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: ${{ matrix.dotnet-version }}
        - name: build project
          run: dotnet build
  format_and_test:
    
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x']
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Setup dotnet ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
      - name: format code
        run: dotnet format
      - name: test
        run: dotnet test
        
  
    
